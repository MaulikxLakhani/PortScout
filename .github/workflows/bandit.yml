name: Bandit Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 13 * * 5"  # weekly on Friday at 13:00 UTC

jobs:
  bandit:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Bandit security scan
        uses: PyCQA/bandit-action@v1
        with:
          severity: "crtical"
          confidence: "medium"
          
